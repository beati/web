<!DOCTYPE html>
<script src="../../common/head.js"></script>
<script>
    const root = "../..";
    html();
    head(root, "Gebet | Beat Gubser", "Gebet");
</script>

<script src="../../common/body.js"></script>
<body>
<script>bodyHeader(root, "Gebet", menuTools, menuToolsGebet)</script>
<main id="mainId">
    <script>
        const main = document.getElementById("mainId");
        const status = sessionStorage.getItem('gebet-status');
        if ("ziehen" === status) {
            const gebetAnliegen = sessionStorage.getItem('gebet-anliegen');
            if (gebetAnliegen) {
                main.append(getElement("pre", gebetAnliegen));
            }
            const spaceBetweenElement = getElement("div", undefined, "flex-space-between separator flex-align-center");
            main.append(spaceBetweenElement);
            spaceBetweenElement.append(getSimplebutton("reset()", "Reset"));
            spaceBetweenElement.append(getElement("div", sessionStorage.getItem('gebet-info') ? sessionStorage.getItem('gebet-info') : '—'));
            spaceBetweenElement.append(getSimplebutton("ziehen()", "Ziehen"));
            main.append(getElement("pre", sessionStorage.getItem('gebet-liste')));
        } else {
            const fileElement = getElement("pre");
            main.append(fileElement);
            const inputElement = getElement("input");
            inputElement.setAttribute("type", "file");
            inputElement.setAttribute("id", "gebet-liste-id");
            inputElement.setAttribute("accept", "text/plain,text/markdown");
            fileElement.append(inputElement);

            const spaceBetweenButtonElement = getElement("div", undefined, "flex-space-between");
            main.append(spaceBetweenButtonElement);
            spaceBetweenButtonElement.append(getSimplebutton("reset()", "Reset"));
            spaceBetweenButtonElement.append(getSimplebutton("laden()", "Laden"));

            main.append(getElement("div", "Es gibt verschiedene Formen des Gebets.", "separator"));
            main.append(getElement("div", "Eine Möglichkeit ist es Gebetsanliegen als Listen zu führen und regelmässig für diese Anliegen zu beten."));
            main.append(getElement("div", "Ich stelle hier ein einfaches Werkzeug zur Verfügung, mit welchem Sie zufällig Anliegen aus einer Liste ziehen und dafür beten können."));

            const spaceBetweenBeispielElement = getElement("div", undefined, "flex-space-between");
            main.append(spaceBetweenBeispielElement);
            const beispielLink = getElement("div");
            beispielLink.innerHTML = "Eine solche Liste besteht aus einer Text- oder Markdown-Datei, z.B. <a href='./Anliegen.txt' target='_blank'>Anliegen.txt</a>.";
            spaceBetweenBeispielElement.append(beispielLink);
            spaceBetweenBeispielElement.append(getSimplebutton("beispiel()", "Beispiel"));

            main.append(getElement("div", "Ihre Liste können Sie oben auswählen und laden."));
        }

        function reset() {
            sessionStorage.removeItem('gebet-status');
            sessionStorage.removeItem('gebet-liste');
            sessionStorage.removeItem('gebet-anliegen');
            sessionStorage.setItem('gebet-zaehler', 0);
            sessionStorage.removeItem('gebet-info');
            location.reload();
        }

        function beispiel() {
            fetch('/tools/gebet/Anliegen.txt')
                .then(response => {
                    return response.text();
                })
                .then(text => {
                    sessionStorage.setItem('gebet-liste', text);
                    sessionStorage.setItem('gebet-status', 'ziehen');
                    location.reload();
                });
        }

        function laden() {
            const gebetListe = sessionStorage.getItem('gebet-liste');
            if (gebetListe) {
                sessionStorage.setItem('gebet-status', 'ziehen');
                location.reload();
            } else {
                this.reset();
            }
        }

        function ziehen() {
            const gebetListe = sessionStorage.getItem('gebet-liste');
            if (gebetListe) {
                const zeilen = gebetListe.split(/\r?\n/);
                const zeilenFiltered = zeilen.filter(zeile => {
                    if (!zeile) {
                        return false;
                    } else if (zeile.startsWith('#')) {
                        return false;
                    } else {
                        return true;
                    }
                });
                const length = zeilenFiltered.length;
                if (length > 0) {
                    const randomIndex = Math.floor(Math.random() * length);
                    const zeile = zeilenFiltered.at(randomIndex);
                    const gebetZaehler = Number(sessionStorage.getItem('gebet-zaehler')) + 1;
                    sessionStorage.setItem('gebet-zaehler', gebetZaehler);
                    sessionStorage.setItem('gebet-info', `#${gebetZaehler} / ${randomIndex + 1} / ${length}`);
                    sessionStorage.setItem('gebet-anliegen', `${zeile}`);
                    location.reload();
                } else {
                    this.reset();
                }
            } else {
                this.reset();
            }
        }

        const gebetListe = document.getElementById('gebet-liste-id');
        if (gebetListe) {
            gebetListe.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const liste = e.target.result;
                        if (liste) {
                            if (file.type === 'text/plain' || file.type === 'text/markdown') {
                                sessionStorage.setItem('gebet-liste', liste);
                            } else {
                                sessionStorage.setItem('gebet-liste', `# ${file.type}`);
                            }
                        }
                    };
                    reader.readAsText(file);
                } else {
                    this.reset();
                }
            });
        }
    </script>
</main>
<script>bodyFooter()</script>
</body>
