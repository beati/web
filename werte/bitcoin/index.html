<!DOCTYPE html>
<script src="../../common/head.js"></script>
<script>
    const root = "../..";
    html();
    head(root, "Bitcoin | Beat Gubser", "Bitcoin");
</script>

<script src="../../common/body.js"></script>
<body>
<script>bodyHeader(root, "Bitcoin", menuWerte, menuWerteBitcoin)</script>
<main id="mainId">
    <script>
        const now = new Date(Date.now()).toLocaleString("de");
        const ticker = JSON.parse(getSyncUrl("https://blockchain.info/ticker"));
        const btcChfLast = ticker.CHF.last.toLocaleString('de-CH').padStart(10, " ");
        const btcUsdLast = ticker.USD.last.toLocaleString('de-CH').padStart(10, " ");
        const btcEurLast = ticker.EUR.last.toLocaleString('de-CH').padStart(10, " ");

        const main = document.getElementById("mainId");
        main.append(getElement("div", `Bitcoinpreis am ${now}`, "separator"));

        const preElement = getElement("pre");
        main.append(preElement);
        preElement.append(getElement("div", `1 BTC = ${btcChfLast} CHF`));
        preElement.append(getElement("div", `1 BTC = ${btcUsdLast} USD`));
        preElement.append(getElement("div", `1 BTC = ${btcEurLast} EUR`));
    </script>

    <div id="bitcoinId"></div>
    <script>
        getAsyncUrlForId("bitcoin.html", "bitcoinId");
    </script>
</main>
<script>bodyFooter()</script>
</body>
