<!DOCTYPE html>
<script src="../../common/common.js"></script>

<script>
    const root = "../..";
    html();
    headBody(root, "Bitcoin | Beat Gubser", "Bitcoin");
    header(root, "Bitcoin", menuWerte, menuWerteBitcoin);
</script>

<main>
    <script>
        const now = new Date(Date.now()).toLocaleString("de");
        const ticker = JSON.parse(getSyncUrl("https://blockchain.info/ticker"));
        const btcChfLast = String(ticker.CHF.last.toFixed(2)).padStart(9, " ");
        const btcUsdLast = String(ticker.USD.last.toFixed(2)).padStart(9, " ");
        const btcEurLast = String(ticker.EUR.last.toFixed(2)).padStart(9, " ");
    </script>
    <div>
        Bitcoinpreis am <script>document.write(now)</script>
    </div>
    <script>
        document.writeln("<pre>");
        document.writeln("<code>1 BTC = " + btcChfLast + " CHF</code>");
        document.writeln("<code>1 BTC = " + btcUsdLast + " USD</code>");
        document.writeln("<code>1 BTC = " + btcEurLast + " EUR</code>");
        document.writeln("</pre>");
    </script>

    <div id="bitcoinId"></div>
    <script>
        getAsyncUrlForId("bitcoin.html", "bitcoinId");
    </script>
</main>

<script>
    footerBodyHtml();
</script>
