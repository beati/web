<!DOCTYPE html>
<script src="../../common/common.js"></script>

<script>
    const root = "../..";
    html();
    headBody(root, "Bitcoin | Beat Gubser", "Bitcoin");
    header(root, "Bitcoin", menuWerte, menuWerteBitcoin);
</script>

<main>
    <script>
        const now = new Date(Date.now()).toLocaleString("de");
        const ticker = JSON.parse(getSyncUrl("https://blockchain.info/ticker"));
        const btcChfLast = String(ticker.CHF.last).padStart(9, " ");
        const btcUsdLast = String(ticker.USD.last).padStart(9, " ");
        const btcEurLast = String(ticker.EUR.last).padStart(9, " ");
    </script>
    <div>
        Bitcoinpreis am <script>document.write(now)</script>
    </div>
    <pre>
        <code>1 BTC = <script>document.write(btcChfLast)</script> CHF</code>
        <code>1 BTC = <script>document.write(btcUsdLast)</script> USD</code>
        <code>1 BTC = <script>document.write(btcEurLast)</script> EUR</code>
    </pre>

    <div id="bitcoinId"></div>
    <script>
        getAsyncUrlForId("bitcoin.html", "bitcoinId");
    </script>
</main>

<script>
    footerBodyHtml();
</script>
