<!DOCTYPE html>
<script src="../../common/common.js"></script>

<script>
    const root = "../..";
    html();
    head(root, "Gold | Beat Gubser", "Gold");
    bodyHeader(root, "Gold", menuWerte, menuWerteGold);
</script>

<main id="mainId">
    <script>
        const feinunze = 31.1034768;
        const xau = JSON.parse(getSyncUrl("https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/xau.json?_=" + new Date().getTime()));
        const date = new Date(Date.parse(xau.date)).toLocaleDateString("de");
        const xauChf = xau.xau.chf;
        const xauChfOz = xauChf.toLocaleString('de-CH');
        const xauChfKg = (xauChf / feinunze * 1000).toLocaleString('de-CH').padStart(11, " ");
        const xauUsd = xau.xau.usd;
        const xauUsdOz = xauUsd.toLocaleString('de-CH');
        const xauUsdKg = (xauUsd / feinunze * 1000).toLocaleString('de-CH').padStart(11, " ");
        const xauEur = xau.xau.eur;
        const xauEurOz = xauEur.toLocaleString('de-CH');
        const xauEurKg = (xauEur / feinunze * 1000).toLocaleString('de-CH').padStart(11, " ");

        const main = document.getElementById("mainId");
        main.append(getElement("div", `Goldpreis am ${date}`, "separator"));

        const ozElement = getElement("pre");
        main.append(ozElement);
        ozElement.append(getElement("div", `1 Feinunze XAU = ${xauChfOz} CHF`));
        ozElement.append(getElement("div", `1 Feinunze XAU = ${xauUsdOz} USD`));
        ozElement.append(getElement("div", `1 Feinunze XAU = ${xauEurOz} EUR`));

        const kgElement = getElement("pre");
        main.append(kgElement);
        kgElement.append(getElement("div", `1 Kilogramm XAU = ${xauChfKg} CHF`));
        kgElement.append(getElement("div", `1 Kilogramm XAU = ${xauUsdKg} USD`));
        kgElement.append(getElement("div", `1 Kilogramm XAU = ${xauEurKg} EUR`));
    </script>

    <div id="goldId"></div>
    <script>
        getAsyncUrlForId("gold.html", "goldId");
    </script>
</main>

<footer>
    <script>footer()</script>
</footer>
