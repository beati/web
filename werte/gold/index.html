<!DOCTYPE html>
<script src="../../common/common.js"></script>

<script>
    const root = "../..";
    html();
    headBody(root, "Gold | Beat Gubser", "Gold");
    header(root, "Gold", menuWerte, menuWerteGold);
</script>

<main>
    <script>
        const feinunze = 31.1034768;
        const xau = JSON.parse(getSyncUrl("https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/xau.min.json"));
        const date = new Date(Date.parse(xau.date)).toLocaleDateString("de");
        const xauChf = xau.xau.chf;
        const xauChfOz = xauChf.toLocaleString('de-CH');
        const xauChfKg = (xauChf / feinunze * 1000).toLocaleString('de-CH').padStart(11, " ");
        const xauUsd = xau.xau.usd;
        const xauUsdOz = xauUsd.toLocaleString('de-CH');
        const xauUsdKg = (xauUsd / feinunze * 1000).toLocaleString('de-CH').padStart(11, " ");
        const xauEur = xau.xau.eur;
        const xauEurOz = xauEur.toLocaleString('de-CH');
        const xauEurKg = (xauEur / feinunze * 1000).toLocaleString('de-CH').padStart(11, " ");
    </script>
    <div>
        Goldpreis am <script>document.write(date)</script>
    </div>
    <script>
        document.writeln("<pre>");
        document.writeln("<code>1 Feinunze XAU = " + xauChfOz + " CHF</code>");
        document.writeln("<code>1 Feinunze XAU = " + xauUsdOz + " USD</code>");
        document.writeln("<code>1 Feinunze XAU = " + xauEurOz + " EUR</code>");
        document.writeln("</pre>");

        document.writeln("<pre>");
        document.writeln("<code>1 Kilogramm XAU = " + xauChfKg + " CHF</code>");
        document.writeln("<code>1 Kilogramm XAU = " + xauUsdKg + " USD</code>");
        document.writeln("<code>1 Kilogramm XAU = " + xauEurKg + " EUR</code>");
        document.writeln("</pre>");
    </script>

    <div id="goldId"></div>
    <script>
        getAsyncUrlForId("gold.html", "goldId");
    </script>
</main>

<script>
    footerBodyHtml();
</script>
